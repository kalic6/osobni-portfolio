    <!-- Google Consent Mode v2 (musí běžet před načtením gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      (function () {
        var analyticsGranted = false;
        var marketingGranted = false;
        try {
          var saved = localStorage.getItem('portfolio_cookie_consent_v2');
          if (saved) {
            var parsed = JSON.parse(saved);
            analyticsGranted = Boolean(parsed && parsed.analytics);
            marketingGranted = Boolean(parsed && parsed.marketing);
          }
        } catch (e) {}
        gtag('consent', 'default', {
          ad_storage: marketingGranted ? 'granted' : 'denied',
          ad_user_data: marketingGranted ? 'granted' : 'denied',
          ad_personalization: marketingGranted ? 'granted' : 'denied',
          analytics_storage: analyticsGranted ? 'granted' : 'denied',
          personalization_storage: marketingGranted ? 'granted' : 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted',
          wait_for_update: 500
        });
        gtag('set', 'url_passthrough', true);
        gtag('set', 'ads_data_redaction', !marketingGranted);
      })();
    </script>
